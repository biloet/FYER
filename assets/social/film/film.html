<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, DUR = 34;
const c = document.getElementById("c");
const ctx = c.getContext("2d");

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = (k) => 1 - Math.pow(1 - k, 4);            // easeOutQuart
const eio = (k) => k < .5 ? 8 * k ** 4 : 1 - Math.pow(-2 * k + 2, 4) / 2;
// envelope: fade in over [a, a+i], out over [b-o, b]
const env = (t, a, b, i = .6, o = .5) => Math.min(prog(t, a, a + i), 1 - prog(t, b - o, b));
let seed = 1;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const G1 = "#d4ff6a", G2 = "#7cff6b", G3 = "#00c805", TXT = "#ecfdec", MUTED = "#87ad92";

function grad(x0, x1) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, G1); g.addColorStop(.5, G2); g.addColorStop(1, G3);
  return g;
}

// text with blur-in, rise and tracking
function text(str, x, y, { size = 96, weight = 900, font = "Inter", color = TXT, alpha = 1, blur = 0, rise = 0,
  align = "center", track = 0, gradient = false, glow = 0 } = {}) {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = clamp(alpha);
  ctx.font = `${weight} ${size}px "${font}"`;
  ctx.letterSpacing = track + "px";
  ctx.textAlign = align; ctx.textBaseline = "middle";
  if (blur > .2) ctx.filter = `blur(${blur}px)`;
  let fill = color;
  if (gradient) {
    const w = ctx.measureText(str).width;
    const x0 = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
    fill = grad(x0, x0 + w);
  }
  if (glow) { ctx.shadowColor = "rgba(124,255,107,.55)"; ctx.shadowBlur = glow; }
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y + rise);
  ctx.restore();
}

// words appear one by one (blur + rise)
function words(str, x, y, t, start, step, opts = {}) {
  const parts = str.split(" ");
  ctx.save();
  ctx.font = `${opts.weight || 900} ${opts.size || 96}px "Inter"`;
  ctx.letterSpacing = (opts.track || 0) + "px";
  const space = ctx.measureText(" ").width;
  const widths = parts.map((p) => ctx.measureText(p).width);
  ctx.restore();
  const total = widths.reduce((a, b) => a + b, 0) + space * (parts.length - 1);
  let cx = x - total / 2;
  const out = opts.out ?? 1;
  parts.forEach((p, i) => {
    const k = eo(prog(t, start + i * step, start + i * step + .9));
    text(p, cx, y, { ...opts, align: "left", alpha: k * out, blur: (1 - k) * 18 + (1 - out) * 14, rise: (1 - k) * 40 });
    cx += widths[i] + space;
  });
}

// ---------- static assets ----------
seed = 7;
const dust = Array.from({ length: 260 }, () => ({ x: rnd() * W, y: rnd() * H, s: rnd() * 2 + .4, v: rnd() * 14 + 4 }));
const N = 1500, golden = Math.PI * (3 - Math.sqrt(5));
seed = 21;
const sphere = Array.from({ length: N }, (_, i) => {
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y);
  return { x: Math.cos(golden * i) * r, y, z: Math.sin(golden * i) * r,
    sx: rnd() * W, sy: rnd() * H, d: rnd() * .5, f: rnd() };
});
const noise = document.createElement("canvas");
noise.width = noise.height = 256;
{
  const n = noise.getContext("2d"), img = n.createImageData(256, 256);
  seed = 99;
  for (let i = 0; i < img.data.length; i += 4) {
    const v = rnd() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  n.putImageData(img, 0, 0);
}
const ledger = (() => {
  seed = 42;
  const hex = () => "0x" + Math.floor(rnd() * 0xffff).toString(16).padStart(4, "0") + "…" + Math.floor(rnd() * 0xffff).toString(16).padStart(4, "0");
  return Array.from({ length: 16 }, (_, i) => ({
    from: hex(), to: hex(), amt: (rnd() * 40 + .1).toFixed(4) + " ETH",
    time: `12:${String(4 + (i * 7) % 56).padStart(2, "0")}:${String(Math.floor(rnd() * 60)).padStart(2, "0")}`,
    block: "#" + (1204511 + i * 3),
  }));
})();

// ---------- layers ----------
function background(t) {
  ctx.fillStyle = "#020604"; ctx.fillRect(0, 0, W, H);
  // aurora
  const blobs = [
    [W * (.25 + .08 * Math.sin(t * .15)), H * (.2 + .06 * Math.cos(t * .2)), 900, "rgba(0,200,5,.28)"],
    [W * (.8 + .05 * Math.cos(t * .12)), H * (.75 + .05 * Math.sin(t * .17)), 800, "rgba(31,122,58,.30)"],
  ];
  for (const [x, y, r, col] of blobs) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  for (const p of dust) {
    const y = (p.y - t * p.v + H * 10) % H;
    ctx.fillStyle = `rgba(150,255,140,${.22 * p.s})`;
    ctx.fillRect(p.x + Math.sin(t * .3 + p.y) * 6, y, p.s, p.s);
  }
}

function drawSphere(t, { cx = W / 2, cy = H / 2, R = 380, alpha = 1, form = 1, spin = 0, flashes = 0 } = {}) {
  if (alpha <= 0) return;
  const ry = t * .18 + spin, rx = -.35 + Math.sin(t * .2) * .05;
  const cY = Math.cos(ry), sY = Math.sin(ry), cX = Math.cos(rx), sX = Math.sin(rx);
  // core glow
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.3);
  g.addColorStop(0, `rgba(0,200,5,${.35 * alpha * form})`); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(cx - R * 1.4, cy - R * 1.4, R * 2.8, R * 2.8);
  for (let i = 0; i < N; i++) {
    const p = sphere[i];
    const x1 = p.x * cY - p.z * sY, z1 = p.x * sY + p.z * cY;
    const y1 = p.y * cX - z1 * sX, z2 = p.y * sX + z1 * cX;
    const d = (z2 + 1) / 2, persp = 1 + z2 * .25;
    const k = eio(clamp((form - p.d) / (1 - p.d * .5)));
    const x = lerp(p.sx, cx + x1 * R * persp, k), y = lerp(p.sy, cy + y1 * R * persp, k);
    const s = (.8 + d * 2.2) * (1 + (1 - k) * 1.2);
    const a = alpha * (k < 1 ? .8 + k * .2 : 1) * (.25 + d * .7);
    if (flashes && d > .55 && ((p.f * 13 + t * .9) % 1) < flashes) {
      ctx.fillStyle = `rgba(200,255,160,${.5 * alpha * d})`;
      ctx.beginPath(); ctx.arc(x, y, s * 2.4, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = `rgba(${90 + d * 70 | 0},255,${100 + d * 40 | 0},${a})`;
    ctx.fillRect(x, y, s, s);
  }
  ctx.strokeStyle = `rgba(124,255,107,${.18 * alpha * form})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.45 * form, R * .32 * form, -.22, 0, 6.283); ctx.stroke();
}

function post(t, frame) {
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .95);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(1,3,2,.85)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // grain
  ctx.save();
  ctx.globalAlpha = .07; ctx.globalCompositeOperation = "overlay";
  const ox = (frame * 73) % 256, oy = (frame * 151) % 256;
  ctx.fillStyle = ctx.createPattern(noise, "repeat");
  ctx.translate(-ox, -oy); ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
  // letterbox: closed-ish until reveal, then opens
  const lb = 130 * (1 - eio(prog(t, 11.6, 13.4)));
  if (lb > .5) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, lb); ctx.fillRect(0, H - lb, W, lb); }
  // fades from/to black
  const black = Math.max(1 - prog(t, 0, .8), prog(t, DUR - .9, DUR));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
}

function flash(t, at, dur = .35, strength = .5) {
  const k = prog(t, at, at + dur);
  if (k <= 0 || k >= 1) return;
  ctx.fillStyle = `rgba(180,255,160,${(1 - k) ** 2 * strength})`;
  ctx.fillRect(0, 0, W, H);
}

// ---------- scenes ----------
function sceneStory(t) {        // 0 – 4.2
  const out = 1 - prog(t, 3.7, 4.2);
  words("Every transaction on a public chain", W / 2, H / 2 - 60, t, .6, .14, { size: 84, weight: 800, out });
  words("tells a story.", W / 2, H / 2 + 55, t, 1.6, .18, { size: 84, weight: 900, gradient: true, glow: 30, out });
}

function sceneLedger(t) {       // 4.2 – 11.6
  const a = env(t, 4.2, 11.6, .8, .6);
  if (a <= 0) return;
  const rowH = 58, x0 = 260, top = 150 - (t - 4.2) * 22;
  const focus = t < 5.8 ? "to" : t < 7.2 ? "amt" : t < 8.8 ? "time" : null;
  ctx.save();
  ctx.font = `500 26px "JetBrains Mono"`;
  ctx.textBaseline = "middle";
  ledger.forEach((r, i) => {
    const y = top + i * rowH;
    if (y < -40 || y > H + 40) return;
    const rowA = a * (.25 + .2 * Math.sin(i + t)) ;
    const cols = [["block", r.block, 0], ["from", r.from, 200], ["→", "", 470], ["to", r.to, 530], ["amt", r.amt, 820], ["time", r.time, 1150]];
    // redaction progress per row
    const red = eo(prog(t, 9.0 + i * .05, 9.5 + i * .05));
    for (const [key, val, dx] of cols) {
      const hl = key === focus;
      ctx.globalAlpha = hl ? a * .95 : rowA;
      ctx.fillStyle = hl ? G2 : MUTED;
      ctx.fillText(key === "→" ? "→" : val, x0 + dx, y);
      if (["from", "to", "amt"].includes(key) && red > 0) {
        const w = ctx.measureText(val).width;
        ctx.globalAlpha = a * .95;
        const g = ctx.createLinearGradient(x0 + dx, 0, x0 + dx + w, 0);
        g.addColorStop(0, "#0f3a1b"); g.addColorStop(.5, "#2a7a3c"); g.addColorStop(1, "#0f3a1b");
        ctx.fillStyle = g;
        ctx.fillRect(x0 + dx - 4, y - 15, (w + 8) * red, 30);
      }
    }
  });
  ctx.restore();
  // darken center for headline legibility
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 700);
  g.addColorStop(0, `rgba(2,6,4,${.82 * a})`); g.addColorStop(1, "rgba(2,6,4,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const lines = [["Who you pay.", 4.5, 5.8], ["What you hold.", 5.9, 7.2], ["When you move.", 7.3, 8.8]];
  for (const [s, a0, a1] of lines) {
    const k = env(t, a0, a1, .45, .35);
    if (k > 0) text(s, W / 2, H / 2, { size: 132, weight: 900, alpha: k, blur: (1 - k) * 16, rise: (1 - k) * 30 });
  }
  const u = env(t, 9.9, 11.5, .5, .4);
  if (u > 0) text("Until now.", W / 2, H / 2, { size: 150, weight: 900, gradient: true, glow: 40, alpha: u, blur: (1 - u) * 18, rise: (1 - u) * 30 });
}

function sceneReveal(t) {       // 11.6 – 16.2
  const form = eio(prog(t, 11.6, 13.6));
  const a = env(t, 11.6, 16.4, .2, .7);
  drawSphere(t, { R: 400, alpha: a, form, flashes: .02 });
  // wordmark
  const letters = "FYER".split("");
  ctx.save(); ctx.font = `900 210px "Inter"`; ctx.letterSpacing = "40px";
  const totalW = ctx.measureText("FYER").width; ctx.restore();
  let x = W / 2 - totalW / 2 + 20;
  letters.forEach((L, i) => {
    const k = eo(prog(t, 13.0 + i * .1, 13.9 + i * .1));
    ctx.save(); ctx.font = `900 210px "Inter"`; const lw = ctx.measureText(L).width; ctx.restore();
    text(L, x, H / 2 - 20, { size: 210, weight: 900, align: "left", gradient: true, glow: 50,
      alpha: k * (1 - prog(t, 15.7, 16.2)), blur: (1 - k) * 22, rise: (1 - k) * 70 });
    x += lw + 40;
  });
  const lw = 520 * eo(prog(t, 13.6, 14.6));
  ctx.fillStyle = `rgba(124,255,107,${.8 * (1 - prog(t, 15.7, 16.2))})`;
  ctx.fillRect(W / 2 - lw / 2, H / 2 + 105, lw, 2);
  const s = env(t, 14.0, 16.2, .6, .5);
  text("ZERO-KNOWLEDGE PRIVACY FOR ROBINHOOD CHAIN", W / 2, H / 2 + 160, { size: 26, weight: 500, font: "JetBrains Mono", color: MUTED, track: 8, alpha: s });
}

function sceneTagline(t) {      // 16.2 – 19.6
  const a = env(t, 16.0, 19.8, .6, .6);
  drawSphere(t, { R: 470, alpha: a * .55, form: 1 });
  const out = 1 - prog(t, 19.2, 19.7);
  words("Private money.", W / 2, H / 2 - 75, t, 16.4, .16, { size: 140, out });
  words("Same Robinhood Chain.", W / 2, H / 2 + 75, t, 16.9, .16, { size: 140, gradient: true, glow: 40, out });
}

function sceneSteps(t) {        // 19.6 – 26.6
  const steps = [
    ["01", "Shield", "Deposit once. Get a private note", "only your key can spend.", 19.6],
    ["02", "Send & trade", "A zk-proof proves it’s valid —", "without revealing who, what or how much.", 21.9],
    ["03", "Withdraw", "Exit to any fresh address.", "No on-chain link back to you.", 24.2],
  ];
  const a = env(t, 19.6, 26.7, .6, .6);
  const cx = W * .7, cy = H / 2, R = 300;
  drawSphere(t, { cx, cy, R, alpha: a * .9, form: 1 });
  steps.forEach(([n, title, d1, d2, s], i) => {
    const k = env(t, s, s + 2.3, .55, .4);
    if (k <= 0) return;
    const x = 200;
    // outlined number
    ctx.save(); ctx.globalAlpha = k; ctx.font = `900 150px "Inter"`; ctx.textBaseline = "middle";
    ctx.strokeStyle = "rgba(124,255,107,.75)"; ctx.lineWidth = 2;
    if (k < 1) ctx.filter = `blur(${(1 - k) * 12}px)`;
    ctx.strokeText(n, x, H / 2 - 150 + (1 - k) * 30); ctx.restore();
    text(title, x, H / 2 - 10, { size: 96, weight: 900, align: "left", alpha: k, blur: (1 - k) * 14, rise: (1 - k) * 30 });
    text(d1, x, H / 2 + 80, { size: 34, weight: 500, align: "left", color: MUTED, alpha: k, rise: (1 - k) * 30 });
    text(d2, x, H / 2 + 128, { size: 34, weight: 500, align: "left", color: MUTED, alpha: k, rise: (1 - k) * 30 });

    // visual per step
    const p = prog(t, s + .3, s + 2.0);
    ctx.save(); ctx.globalAlpha = k;
    if (i === 0) {          // coin enters the pool
      const e = eio(p);
      const x0 = cx - R * 1.9, y0 = cy - R * .9;
      const px = lerp(x0, cx, e), py = lerp(y0, cy, e), r = lerp(26, 10, e);
      dot(px, py, r, 1 - prog(p, .85, 1));
      label("0x7a3f…e91c", x0, y0 - 50, 1 - prog(p, .3, .6));
      ring(cx, cy, R * .25 + e * R * .6, prog(p, .85, 1));
    } else if (i === 1) {   // hidden hops inside
      const pts = [[-.45, -.2], [.1, -.5], [.4, .1], [-.1, .45], [-.45, -.2]];
      const seg = p * (pts.length - 1), si = Math.min(pts.length - 2, Math.floor(seg)), f = eio(seg - si);
      ctx.strokeStyle = "rgba(124,255,107,.45)"; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
      ctx.beginPath();
      for (let j = 0; j <= si + 1; j++) {
        const [ax, ay] = pts[j];
        const X = cx + ax * R, Y = cy + ay * R;
        if (j === 0) ctx.moveTo(X, Y);
        else if (j <= si) ctx.lineTo(X, Y);
        else { const [bx, by] = pts[j - 1]; ctx.lineTo(cx + lerp(bx, ax, f) * R, cy + lerp(by, ay, f) * R); }
      }
      ctx.stroke(); ctx.setLineDash([]);
      const [bx, by] = pts[si], [nx, ny] = pts[si + 1];
      dot(cx + lerp(bx, nx, f) * R, cy + lerp(by, ny, f) * R, 12, 1);
      label("proof ✓", cx + R * .55, cy - R * .75, prog(p, .2, .4));
    } else {                // exit to fresh address
      const e = eio(p);
      const x1 = cx + R * 1.75, y1 = cy + R * .85;
      dot(lerp(cx, x1, e), lerp(cy, y1, e), lerp(10, 24, e), 1);
      label("0x9c51…02ad", x1 - 80, y1 + 56, prog(p, .75, 1));
    }
    ctx.restore();
  });
}
function dot(x, y, r, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.shadowColor = G2; ctx.shadowBlur = 40; ctx.fillStyle = G2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.restore();
}
function ring(x, y, r, a) {
  if (a <= 0 || a >= 1) return;
  ctx.save(); ctx.strokeStyle = `rgba(124,255,107,${(1 - a) * .8})`; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.stroke(); ctx.restore();
}
function label(s, x, y, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = `500 26px "JetBrains Mono"`; const w = ctx.measureText(s).width + 36;
  ctx.fillStyle = "rgba(10,28,16,.85)"; ctx.strokeStyle = "rgba(124,255,107,.4)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - 24, w, 48, 24); ctx.fill(); ctx.stroke();
  ctx.fillStyle = G2; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(s, x, y + 1);
  ctx.restore();
}

function sceneFees(t) {         // 26.6 – 29.8
  const a = env(t, 26.6, 29.9, .5, .5);
  if (a <= 0) return;
  const cols = [[0.3, "SHIELD"], [0, "PRIVATE TRANSFER"], [0.3, "WITHDRAW"]];
  cols.forEach(([v, l], i) => {
    const k = eo(prog(t, 26.7 + i * .15, 27.6 + i * .15));
    const x = W / 2 + (i - 1) * 520, y = H / 2 - 50;
    const val = (v * eo(prog(t, 26.8, 28.0))).toFixed(v ? 1 : 0) + "%";
    text(val, x, y, { size: 170, weight: 900, gradient: i === 1, glow: i === 1 ? 40 : 0, alpha: a * k, blur: (1 - k) * 14, rise: (1 - k) * 40 });
    text(l, x, y + 120, { size: 26, weight: 500, font: "JetBrains Mono", color: G2, track: 6, alpha: a * k });
  });
  const s = env(t, 28.0, 29.9, .5, .5);
  text("Non-custodial  ·  Zero-knowledge  ·  Any EVM wallet", W / 2, H / 2 + 220, { size: 34, weight: 500, color: MUTED, alpha: s, rise: (1 - s) * 20 });
}

function sceneEnd(t) {          // 29.8 – 34
  const a = env(t, 29.8, 34.5, .7, .1);
  if (a <= 0) return;
  drawSphere(t, { R: 520, alpha: a * .45, form: 1 });
  const k = eo(prog(t, 29.9, 31.0));
  // logo mark
  ctx.save(); ctx.globalAlpha = a * k;
  const s = 150, x = W / 2 - s / 2, y = H / 2 - 230 + (1 - k) * 30;
  ctx.fillStyle = "#06120a"; ctx.strokeStyle = "rgba(124,255,107,.45)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, s, s, 36); ctx.fill(); ctx.stroke();
  ctx.translate(x, y); ctx.scale(s / 64, s / 64);
  const g = ctx.createLinearGradient(0, 0, 64, 64); g.addColorStop(0, G1); g.addColorStop(1, G3);
  ctx.fillStyle = g; ctx.shadowColor = "rgba(124,255,107,.7)"; ctx.shadowBlur = 20;
  ctx.fill(new Path2D("M20 46V18h26v7H28v6h15v7H28v8z"));
  ctx.restore();
  text("FYER", W / 2 + 12, H / 2 + 20, { size: 120, weight: 900, track: 24, alpha: a * k, blur: (1 - k) * 12 });
  const m = eo(prog(t, 30.6, 31.6));
  text("Shield once. Move freely.", W / 2, H / 2 + 130, { size: 48, weight: 700, gradient: true, glow: 24, alpha: a * m, rise: (1 - m) * 20 });
  const n = eo(prog(t, 31.2, 32.2));
  text("@fyerdotsite", W / 2, H / 2 + 225, { size: 30, weight: 500, font: "JetBrains Mono", color: MUTED, track: 4, alpha: a * n });
}

window.draw = (t, frame = Math.round(t * 30)) => {
  ctx.save();
  // subtle camera push-in for the whole film
  const z = 1 + t * .0025;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  background(t);
  if (t < 4.3) sceneStory(t);
  if (t > 4.1 && t < 11.7) sceneLedger(t);
  if (t > 11.5 && t < 16.5) sceneReveal(t);
  if (t > 15.9 && t < 19.9) sceneTagline(t);
  if (t > 19.5 && t < 26.8) sceneSteps(t);
  if (t > 26.5 && t < 30) sceneFees(t);
